services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_saas
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restaurant_user:${POSTGRES_PASSWORD}@postgres:5432/restaurant_saas?schema=public
      BACKUP_DIR: /app/backups
      PLATFORM_RUNTIME_DIR: /app/runtime
      TENANT_RESTORE_ENABLED: ${TENANT_RESTORE_ENABLED:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      APP_DEBUG_LOGS: ${APP_DEBUG_LOGS:-false}
      SERVER_METRICS_FILE: ${SERVER_METRICS_FILE:-/app/host-metrics/metrics.json}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups:ro
      - ./host-metrics:/app/host-metrics:ro
      - ./runtime:/app/runtime

  maintenance-worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restaurant_user:${POSTGRES_PASSWORD}@postgres:5432/restaurant_saas?schema=public
      BACKUP_DIR: /app/backups
      PLATFORM_RUNTIME_DIR: /app/runtime
      TENANT_RESTORE_ENABLED: ${TENANT_RESTORE_ENABLED:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      APP_DEBUG_LOGS: ${APP_DEBUG_LOGS:-false}
      MAINTENANCE_WORKER_INTERVAL_MS: ${MAINTENANCE_WORKER_INTERVAL_MS:-30000}
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
      - ./host-metrics:/app/host-metrics:ro
      - ./runtime:/app/runtime
    command: ["pnpm", "platform:worker:loop"]
    restart: unless-stopped

volumes:
  postgres_data:
